receivers:
  filelog:
    include: ["/var/lib/docker/containers/*/*.log"]
    start_at: end
    storage: file_storage

extensions:
  file_storage:
    directory: /etc/otel-contrib/.data/storage/
    create_directory: true

exporters:
  file:
    path: /etc/otel-contrib/.data/storage/output_logs.log

service:
  extensions: [file_storage]
  pipelines:
    logs:
      receivers: [filelog]
      exporters: [file]
