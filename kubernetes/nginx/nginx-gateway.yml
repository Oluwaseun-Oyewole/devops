apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
spec:
  gatewayClassName: my-gateway-class # provided by your installed controller
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-route
spec:
  parentRefs:

  hostnames:
    - myapp.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

    - backendRefs:
        - name: web-service
          kind: NodePort
          port: 80
