apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
type: Opaque

# stringData lets you write plain text; Kubernetes base64-encodes it for you.
# CHANGE these placeholder values before applying, and never commit
# real passwords to Git.
stringData:
  mongo-root-username: dXNlcm5hbWU=
  mongo-root-password: cGFzc3dvcmQ=
