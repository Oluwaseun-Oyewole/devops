apiVersion: v1
kind: Service
metadata:
  name: mongo-express-service
spec:
  # NodePort makes the web UI reachable from your browser via Minikube.
  type: NodePort
  selector:
    app: mongo-express
  ports:
    - protocol: TCP  
      port: 8081
      targetPort: 8081
      nodePort: 30000 # must be in the   range 30000-32767
 