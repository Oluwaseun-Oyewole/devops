services:
  nest-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nest-app
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      jenkins:
        condition: service_healthy
    networks:
      - nest-app
    restart: unless-stopped

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - '8080:8080'
      - '50000:50000'

    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8080/login']
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nest-app
    volumes:
      - jenkins_home:/var/jenkins_home
    restart: unless-stopped

networks:
  nest-app:
    driver: bridge

volumes:
  nest-app:
  jenkins_home:
