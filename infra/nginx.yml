---
- name: Install and configure Nginx
  hosts: nodes
  become: true
  vars:
    nginx_port: 80

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Nginx
      apt:
        name: nginx
        state: present

    - name: Ensure Nginx is enabled and running
      service:
        name: nginx
        state: started
        enabled: true

    - name: Deploy a basic index.html
      copy:
        content: |
          <html>
            <head><title>Welcome</title></head>
            <body>
              <h1>Nginx is up and running, deployed via Ansible!</h1>
            </body>
          </html>
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: "0644"
      notify: Reload nginx

    - name: Allow HTTP through UFW (if UFW is active)
      ufw:
        rule: allow
        port: "{{ nginx_port }}"
        proto: tcp
      when: ansible_facts.services['ufw.service'] is defined
      ignore_errors: true

  handlers:
    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
