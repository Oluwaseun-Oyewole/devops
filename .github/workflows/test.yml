name: Run tests
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "infras/node-infra/**"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.0
      - name: Install nodejs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 #v7.0.0

      - name: Install node dependencies
        working-directory: /infras/node-infra
        run: npm ci

      - name: Run tests
        working-directory: /infras/node-infra
        run: npm test
